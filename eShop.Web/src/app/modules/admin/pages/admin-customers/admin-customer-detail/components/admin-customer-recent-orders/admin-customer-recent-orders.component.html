<div class="bg-white rounded-2xl shadow-sm border border-zinc-200 p-6">
  <h3 class="text-lg font-semibold mb-4">Thống kê mua hàng</h3>
  
  <!-- Skeleton Loading -->
  <div *ngIf="isLoading" class="animate-pulse flex space-x-4 mb-6">
    <div class="h-12 bg-gray-200 rounded w-1/3"></div>
    <div class="h-12 bg-gray-200 rounded w-1/3"></div>
  </div>

  <!-- Data -->
  <div *ngIf="!isLoading && statistics" class="grid grid-cols-2 gap-4 mb-6">
    <div class="bg-gray-50 p-4 rounded-xl">
      <p class="text-gray-500 text-sm">Tổng đơn hàng</p>
      <p class="text-2xl font-semibold">{{ statistics.totalOrders }}</p>
    </div>
    <div class="bg-gray-50 p-4 rounded-xl">
      <p class="text-gray-500 text-sm">Tổng chi tiêu</p>
      <p class="text-2xl font-semibold">{{ statistics.totalSpent | currency:'VND' }}</p>
    </div>
  </div>

  <h3 class="text-lg font-semibold mb-4">Đơn hàng gần đây</h3>
  <!-- Skeleton -->
  <div *ngIf="isLoading" class="space-y-3">
    <div class="h-8 bg-gray-200 rounded w-full animate-pulse"></div>
    <div class="h-8 bg-gray-200 rounded w-full animate-pulse"></div>
    <div class="h-8 bg-gray-200 rounded w-full animate-pulse"></div>
  </div>
  <!-- List -->
  <div *ngIf="!isLoading && statistics">
    <p *ngIf="statistics?.recentOrders?.length === 0" class="text-gray-500">Khách hàng chưa có đơn hàng nào.</p>
    <ul *ngIf="(statistics?.recentOrders?.length || 0) > 0" class="space-y-2">
      <li *ngFor="let order of statistics?.recentOrders" class="flex justify-between py-2 border-b last:border-0">
        <span class="font-medium">{{ order.orderCode }}</span>
        <span class="text-gray-600">{{ order.totalAmount | currency:'VND' }}</span>
      </li>
    </ul>
  </div>
</div>
